services:
  - type: web
    name: veyra
    runtime: image
    image:
      url: # filled by Render when building from Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VEYRA_MAX_CONCURRENT
        value: 3
      # Session cookies — paste your Netscape cookies.txt content here in the
      # Render dashboard (Settings → Environment → VEYRA_COOKIES).  This unlocks
      # login-walled platforms (Instagram, Pinterest) and softens YouTube bot
      # checks from the datacenter IP.  Export with the "Get cookies.txt LOCALLY"
      # browser extension while logged into the platforms you want to download from.
      #
      # IMPORTANT: Do NOT commit your cookies to the repo.  Set this value only
      # in the Render dashboard as a Secret environment variable.
      - key: VEYRA_COOKIES
        sync: false  # set manually in Render dashboard — never committed
