# Render Blueprint — deploy on Render's free tier:
#   1. Sign up at https://render.com (free, no credit card)
#   2. New + → Blueprint → pick this repo
# The free web service sleeps after 15 min of inactivity (~50s cold start on
# the first request) — fine for a personal tool. For always-on, use a paid
# plan or a free VPS (see README → "Deploying for real").
services:
  - type: web
    name: veyra
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VEYRA_MAX_CONCURRENT
        value: "3"
